<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<title>
ملفات العملاء
</title>

<style>

body{
font-family:tahoma;
background:#f2f5f9
}

.container{
max-width:800px;
margin:auto;
padding:30px
}

.card{
background:white;
padding:25px;
border-radius:14px;
box-shadow:0 6px 14px rgba(0,0,0,.08);
margin-bottom:20px;
}

h2{
text-align:center;
margin-bottom:30px;
}

input,
select,
button{
width:100%;
padding:12px;
margin-top:12px;
border-radius:10px;
border:1px solid #ccc;
font-size:15px;
}

button{
background:#2d89ef;
color:white;
border:none;
cursor:pointer;
font-weight:bold;
}

.back{
display:inline-block;
margin-top:20px;
text-decoration:none;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h2>
ملفات العملاء
</h2>

<div class="card">

<h3>
فتح ملف عميل
</h3>

<form
action="/upload-client"
method="post"
enctype="multipart/form-data"
>

<input
type="file"
name="client_file"
required
>

<select name="mode" required>

<option value="">
اختر العملية
</option>

<option value="first">
طلب قرض
</option>

<option value="continue">
استكمال
</option>

<option value="card">
طلب بطاقة
</option>

</select>

<button type="submit">
فتح العميل
</button>

</form>

</div>

<a class="back" href="/home">
⬅ رجوع
</a>

</div>

</body>
</html>
