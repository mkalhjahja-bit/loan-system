<!DOCTYPE html>
<html dir="rtl">
<head>
<meta charset="UTF-8">
<title>رفع ملفات Excel</title>
</head>
<body>

<h2>رفع ملفات Excel</h2>

<form action="/upload-excels" method="POST" enctype="multipart/form-data">

    <label>رقم الملف</label><br>
    <input type="text" name="file_no" required>

    <br><br>

    <label>اسم العميل</label><br>
    <input type="text" name="client_name" required>

    <br><br>

    <label>ملف الرواتب</label><br>
    <input type="file" name="salary_excel" required>

    <br><br>

    <label>ملف الالتزامات</label><br>
    <input type="file" name="debt_excel" required>

    <br><br>

    <button type="submit">
        رفع إلى Google Drive
    </button>

</form>

<br>

<a href="/home">رجوع</a>

</body>
</html>
